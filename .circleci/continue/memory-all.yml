version: 2.1

parameters:
  default_docker_image:
    type: string
    default: cimg/base:2024.01
  acceptance_tests_dispatch:
    type: boolean
    default: false

orbs:
  slack: circleci/slack@6.0.0
  utils: ethereum-optimism/circleci-utils@1.0.23

commands:
  install-solc-compilers:
    description: "Install the solc compilers"
    parameters:
      solc_versions:
        description: "The versions of solc to install"
        type: string
        default: "0.8.15,0.8.19,0.8.25,0.8.28"
    steps:
      - restore_cache:
          keys:
            - svm-cache-{{ checksum "mise.toml" }}-<<parameters.solc_versions>>
      - run:
          name: Install solc compilers
          command: |
            for version in $(echo "<<parameters.solc_versions>>" | tr ',' '\n'); do
              svm which $version || svm install $version
            done
      - save_cache:
          key: svm-cache-{{ checksum "mise.toml" }}-<<parameters.solc_versions>>
          paths:
            - ~/.svm

  install-contracts-dependencies:
    description: "Install the dependencies for the smart contracts"
    parameters:
      solc_versions:
        description: "The versions of solc to install"
        type: string
        default: "0.8.15,0.8.19,0.8.25,0.8.28"
    steps:
      - install-solc-compilers
      - run:
          name: Install dependencies
          command: |
            git submodule update --init --recursive --single-branch --force -j 8
          working_directory: packages/contracts-bedrock

  notify-failures-on-develop:
    description: "Notify Slack"
    parameters:
      channel:
        type: string
        default: C03N11M0BBN
      mentions:
        type: string
        default: ""
    steps:
      - slack/notify:
          channel: << parameters.channel >>
          event: fail
          template: basic_fail_1
          branch_pattern: develop
          mentions: "<< parameters.mentions >>"

  install-zstd:
    description: "Install zstd compression utility"
    steps:
      - run:
          name: Install zstd
          command: sudo apt-get update && sudo apt-get install -y zstd=1.4.8*

  rust-setup-env:
    description: "Fix rust mise environment variables"
    steps:
      - run:
          name: Fix mise environment variables
          command: |
            echo "export CARGO_HOME=${MISE_CARGO_HOME}" >> "$BASH_ENV"
            echo "export RUSTUP_HOME=${MISE_RUSTUP_HOME}" >> "$BASH_ENV"
            echo "source ${MISE_CARGO_HOME}/env" >> "$BASH_ENV"
      - run:
          name: Configure Rust binary paths (sysgo)
          command: |
            ROOT_DIR="$(pwd)"
            BIN_DIR="$ROOT_DIR/.circleci-cache/rust-binaries"
            echo "export RUST_BINARY_PATH_KONA_NODE=$ROOT_DIR/kona/target/release/kona-node" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_KONA_SUPERVISOR=$ROOT_DIR/kona/target/release/kona-supervisor" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_OP_RBUILDER=$BIN_DIR/op-rbuilder" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_ROLLUP_BOOST=$BIN_DIR/rollup-boost" >> "$BASH_ENV"

  rust-prepare:
    parameters:
      needs_clang:
        description: "Whether to install clang (needed by bindgen for reth-mdbx-sys)."
        type: boolean
        default: true
    description: "Prepare the Rust environment for the build. Does not copy binaries to/from the cache."
    steps:
      - rust-setup-env
      - when:
          condition: << parameters.needs_clang >>
          steps:
            - run:
                name: Install clang
                command: |
                  export NEEDRESTART_MODE=a
                  sudo -E apt-get update --yes
                  sudo -E apt-get install -y --no-install-recommends clang llvm-dev libclang-dev

  rust-restore-build-cache:
    description: "Restore the target directory cache for a Rust workspace"
    parameters:
      directory:
        description: "Directory containing the Cargo workspace"
        type: string
      version:
        description: "Version of the cache"
        type: string
        default: "15"
      profile:
        description: "Profile to restore the cache for"
        type: string
        default: "debug"
      features:
        description: "Comma-separated list of features to restore the cache for"
        type: string
        default: ""
      prefix:
        description: "Prefix to add to the cache key"
        type: string
        default: "rust-build"
    steps:
      - restore_cache:
          name: Restore << parameters.directory >> target cache
          keys:
            - << parameters.prefix >>-v<< parameters.version >>-{{ checksum "<< parameters.directory >>/Cargo.lock" }}-<< parameters.profile >>-<< parameters.features >>
            - << parameters.prefix >>-v<< parameters.version >>-{{ checksum "<< parameters.directory >>/Cargo.lock" }}-<< parameters.profile >>
            - << parameters.prefix >>-v<< parameters.version >>-{{ checksum "<< parameters.directory >>/Cargo.lock" }}
      - restore_cache:
          name: Restore << parameters.directory >> registry cache (mise)
          keys:
            - << parameters.prefix >>-registry-v<< parameters.version >>-{{ checksum "<< parameters.directory >>/Cargo.lock" }}

  rust-save-build-cache:
    description: "Save the target directory cache for a Rust workspace"
    parameters:
      directory:
        description: "Directory containing the Cargo workspace"
        type: string
      version:
        description: "Version of the cache"
        type: string
        default: "15"
      profile:
        description: "Profile to save the cache for"
        type: string
        default: "debug"
      features:
        description: "Comma-separated list of features to save the cache for"
        type: string
        default: ""
      prefix:
        description: "Prefix to add to the cache key"
        type: string
        default: "rust-build"
    steps:
      - save_cache:
          key: << parameters.prefix >>-registry-v<< parameters.version >>-{{ checksum "<< parameters.directory >>/Cargo.lock" }}
          name: Save << parameters.directory >> registry cache (mise)
          paths:
            - /data/mise-data/.cargo/registry
            - /data/mise-data/.cargo/git
            - /data/mise-data/.cargo/bin
            - /data/mise-data/.rustup
      - save_cache:
          key: << parameters.prefix >>-v<< parameters.version >>-{{ checksum "<< parameters.directory >>/Cargo.lock" }}-<< parameters.profile >>-<< parameters.features >>
          name: Save << parameters.directory >> target cache
          paths:
            - << parameters.directory >>/target/<< parameters.profile >>

  rust-prepare-and-restore-cache:
    description: "Prepare the Rust environment and restore the cache"
    parameters:
      needs_clang:
        description: "Whether to install clang (needed by bindgen for reth-mdbx-sys)"
        type: boolean
        default: true
      directory:
        description: "Directory containing the Cargo workspace"
        type: string
      version:
        description: "Version of the cache"
        type: string
        default: "15"
      profile:
        description: "Profile to restore the cache for"
        type: string
        default: "debug"
      features:
        description: "Comma-separated list of features to restore the cache for"
        type: string
        default: "default"
      prefix:
        description: "Prefix to add to the cache key"
        type: string
        default: "rust-build"
    steps:
      - rust-prepare:
          needs_clang: << parameters.needs_clang >>
      - rust-restore-build-cache:
          version: << parameters.version >>
          directory: << parameters.directory >>
          profile: << parameters.profile >>
          features: << parameters.features >>
          prefix: << parameters.prefix >>

  rust-build:
    description: "Build a Rust workspace with target directory caching"
    parameters:
      directory:
        description: "Directory containing the Cargo workspace"
        type: string
      needs_clang:
        description: "Whether to install clang (needed by bindgen for reth-mdbx-sys)"
        type: boolean
        default: true
      version:
        description: "Version of the cache"
        type: string
        default: "15"
      profile:
        description: "Profile to build the binary with"
        type: string
        default: "debug"
      features:
        description: "Comma-separated list of features to build the binary with"
        type: string
        default: "default"
      package:
        description: "Package name to build. If not specified, the workspace will be built."
        type: string
        default: ""
      binary:
        description: "Binary name to build. If not specified, all targets will be built."
        type: string
        default: ""
      save_cache:
        description: "Whether to save the cache at the end of the build"
        type: boolean
        default: false
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - rust-prepare-and-restore-cache:
          needs_clang: << parameters.needs_clang >>
          version: << parameters.version >>
          directory: << parameters.directory >>
          profile: << parameters.profile >>
          features: << parameters.features >>
      - run:
          name: Build << parameters.directory >>
          command: |
            PWD=$(pwd)
            export CARGO_TARGET_DIR="$PWD/<< parameters.directory >>/target"
            echo "CARGO_TARGET_DIR: $CARGO_TARGET_DIR"
            export PROFILE="--profile << parameters.profile >>"

            # Debug profile is specified as "debug" in the config/target, but cargo build expects "dev"
            if [ "<< parameters.profile >>" = "debug" ]; then
              export PROFILE="--profile dev"
            fi

            export PACKAGE="--workspace"
            if [ -n "<< parameters.package >>" ]; then
              export PACKAGE="--package << parameters.package >>"
            fi

            export BINARY="--all-targets"
            if [ -n "<< parameters.binary >>" ]; then
              export BINARY="--bin << parameters.binary >>"
            fi

            export FEATURES="--features << parameters.features >>"
            if [ "<< parameters.features >>" = "all" ]; then
              export FEATURES="--all-features"
            fi

            cd << parameters.directory >> && cargo build $PROFILE $TARGET $PACKAGE $FEATURES
          no_output_timeout: 30m
      - when:
          condition: << parameters.save_cache >>
          steps:
            - rust-save-build-cache:
                directory: << parameters.directory >>
                version: << parameters.version >>
                profile: << parameters.profile >>
                features: << parameters.features >>

jobs:
  rust-build-binary:
    description: "Build a Rust workspace with target directory caching"
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    resource_class: xlarge
    parameters:
      directory:
        description: "Directory containing the Cargo workspace"
        type: string
      needs_clang:
        description: "Whether to install clang (needed by bindgen for reth-mdbx-sys)"
        type: boolean
        default: true
      version:
        description: "Version of the cache"
        type: string
        default: "15"
      profile:
        description: "Profile to build the binary with"
        type: string
        default: "debug"
      features:
        description: "Comma-separated list of features to build the binary with"
        type: string
        default: "default"
      package:
        description: "Package name to build. If not specified, the workspace will be built."
        type: string
        default: ""
      binary:
        description: "Binary name to build. If not specified, all targets will be built."
        type: string
        default: ""
      save_cache:
        description: "Whether to save the cache at the end of the build"
        type: boolean
        default: true
    steps:
      - rust-build:
          directory: << parameters.directory >>
          needs_clang: << parameters.needs_clang >>
          version: << parameters.version >>
          profile: << parameters.profile >>
          features: << parameters.features >>
          package: << parameters.package >>
          binary: << parameters.binary >>
          save_cache: << parameters.save_cache >>

  rust-build-submodule:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    resource_class: xlarge
    parameters:
      directory:
        description: "Directory containing the Cargo workspace"
        type: string
      binaries:
        description: "Space-separated list of binary names to copy from target/release into the cache"
        type: string
      build_command:
        description: "Cargo build command to run"
        type: string
      needs_clang:
        description: "Whether to install clang (needed by bindgen for reth-mdbx-sys)"
        type: boolean
        default: false
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
      - run:
          name: Get << parameters.directory >> submodule HASH
          command: |
            mkdir -p .circleci-cache
            # Verify the path is a git submodule (gitlink). For submodules, ls-tree prints:
            # 160000 commit <sha> <path>
            MODE_AND_TYPE="$(git ls-tree HEAD << parameters.directory >> | awk '{print $1 " " $2}')"
            if [ "$MODE_AND_TYPE" != "160000 commit" ]; then
              echo "ERROR: << parameters.directory >> is not a submodule path (expected '160000 commit', got '$MODE_AND_TYPE')" >&2
              git ls-tree HEAD << parameters.directory >> >&2 || true
              exit 1
            fi

            git ls-tree HEAD << parameters.directory >> | awk '{print $3}' > .circleci-cache/expected-submod-sha.txt
            echo "Expected submodule HASH: $(cat .circleci-cache/expected-submod-sha.txt)"
            echo "<< parameters.binaries >>" | tr ' ' '\n' | awk 'NF' | sort -u > .circleci-cache/expected-binaries.txt
            echo "Expected binaries: $(tr '\n' ' ' < .circleci-cache/expected-binaries.txt)"
      - restore_cache:
          name: Restore << parameters.directory >> cache
          keys:
            - rust-<< parameters.directory >>-v8-{{ checksum ".circleci-cache/expected-submod-sha.txt" }}-{{ checksum ".circleci-cache/expected-binaries.txt" }}
      - run:
          name: Build << parameters.directory >> submodule (if needed)
          command: |
            ROOT_DIR="$(pwd)"
            BIN_CACHE_DIR="$ROOT_DIR/.circleci-cache/rust-binaries"

            HIT=true
            for bin in << parameters.binaries >>; do
              if [ ! -f "$BIN_CACHE_DIR/$bin" ]; then
                HIT=false
                break
              fi
            done
            if [ "$HIT" = "true" ]; then
              echo "Cache hit - binaries exist"
              exit 0
            fi

            echo "Cache miss - will build"
            # Only run on cache miss. We intentionally do not cache into the submodule directory so that cache
            # restore cannot make the submodule path non-empty (which breaks `git submodule update --init`).
            git submodule update --init --recursive --depth 1 -j 8 --single-branch << parameters.directory >>

            if [ "<< parameters.needs_clang >>" = "true" ]; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends clang
            fi

            cd << parameters.directory >> && << parameters.build_command >>

            mkdir -p "$BIN_CACHE_DIR"
            for bin in << parameters.binaries >>; do
              SRC="$ROOT_DIR/<< parameters.directory >>/target/release/$bin"
              DST="$BIN_CACHE_DIR/$bin"
              if [ ! -f "$SRC" ]; then
                echo "ERROR: expected built binary not found at $SRC" >&2
                exit 1
              fi
              cp "$SRC" "$DST"
              chmod +x "$DST" || true
            done
          no_output_timeout: 30m
      - save_cache:
          key: rust-<< parameters.directory >>-v8-{{ checksum ".circleci-cache/expected-submod-sha.txt" }}-{{ checksum ".circleci-cache/expected-binaries.txt" }}
          name: Save << parameters.directory >> cache
          paths:
            - ".circleci-cache/rust-binaries"
      - persist_to_workspace:
          root: .
          paths:
            - ".circleci-cache/rust-binaries"

  contracts-bedrock-build:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    resource_class: 2xlarge
    parameters:
      build_args:
        description: Forge build arguments
        type: string
        default: ""
      profile:
        description: Profile to use for building
        type: string
        default: ci
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - install-zstd
      - install-contracts-dependencies
      - run:
          name: Print forge version
          command: forge --version
      - run:
          name: Pull artifacts
          command: bash scripts/ops/pull-artifacts.sh
          working_directory: packages/contracts-bedrock
      - run:
          name: Build contracts
          command: just forge-build <<parameters.build_args>>
          environment:
            FOUNDRY_PROFILE: <<parameters.profile>>
          working_directory: packages/contracts-bedrock
      - run:
          name: "Copy artifacts into deployer"
          command: |
            just copy-contract-artifacts
          working_directory: op-deployer
      - persist_to_workspace:
          root: "."
          paths:
            - "packages/contracts-bedrock/cache"
            - "packages/contracts-bedrock/artifacts"
            - "packages/contracts-bedrock/forge-artifacts"
            - "op-deployer/pkg/deployer/artifacts/forge-artifacts"
      - notify-failures-on-develop

  cannon-prestate-quick:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    resource_class: xlarge
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - restore_cache:
          name: Restore cannon prestate cache
          key: cannon-prestate-{{ checksum "./cannon/bin/cannon" }}-{{ checksum "op-program/bin/op-program-client.elf" }}
      - run:
          name: Build prestates
          command: make cannon-prestates
      - save_cache:
          key: cannon-prestate-{{ checksum "./cannon/bin/cannon" }}-{{ checksum "op-program/bin/op-program-client.elf" }}
          name: Save Cannon prestate to cache
          paths:
            - "op-program/bin/prestate*.bin.gz"
            - "op-program/bin/meta*.json"
            - "op-program/bin/prestate-proof*.json"
      - persist_to_workspace:
          root: .
          paths:
            - "op-program/bin/prestate*"
            - "op-program/bin/meta*"
            - "op-program/bin/op-program"
            - "op-program/bin/op-program-client"
            - "cannon/bin"

  cannon-kona-prestate:
    machine:
      docker_layer_caching: true
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - restore_cache:
          name: Restore kona cache
          key: kona-prestate-{{ checksum "./kona/justfile" }}-{{ checksum "./kona/version.json" }}
      - run:
          name: Build kona prestates
          command: just build-prestates
          working_directory: kona
      - save_cache:
          key: kona-prestate-{{ checksum "./kona/justfile" }}-{{ checksum "./kona/version.json" }}
          name: Save Kona to cache
          paths:
            - "kona/prestates/"
      - persist_to_workspace:
          root: .
          paths:
            - "kona/prestates/*"

  rust-binaries-for-sysgo:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    resource_class: small
    steps:
      - run:
          name: All Rust binaries ready
          command: echo "All Rust binaries built and persisted to workspace"

  op-acceptance-tests:
    parameters:
      gate:
        description: The gate to run the acceptance tests against. This gate should be defined in op-acceptance-tests/acceptance-tests.yaml.
        type: string
        default: ""
      no_output_timeout:
        description: Timeout for when CircleCI kills the job if there's no output
        type: string
        default: 30m
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    circleci_ip_ranges: true
    resource_class: 2xlarge+
    steps:
      - utils/checkout-with-mise:
          checkout-method: blobless
          enable-mise-cache: true
      - attach_workspace:
          at: .
      # Build kona-node for the acceptance tests. This automatically gets kona from the cache.
      - rust-build:
          directory: kona
          profile: "release"
      - run:
          name: Configure Rust binary paths (sysgo)
          command: |
            ROOT_DIR="$(pwd)"
            BIN_DIR="$ROOT_DIR/.circleci-cache/rust-binaries"
            echo "export RUST_BINARY_PATH_KONA_NODE=$ROOT_DIR/kona/target/release/kona-node" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_KONA_SUPERVISOR=$ROOT_DIR/kona/target/release/kona-supervisor" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_OP_RBUILDER=$BIN_DIR/op-rbuilder" >> "$BASH_ENV"
            echo "export RUST_BINARY_PATH_ROLLUP_BOOST=$BIN_DIR/rollup-boost" >> "$BASH_ENV"
      # Restore cached Go modules
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      # Download Go dependencies
      - run:
          name: Download Go dependencies
          working_directory: op-acceptance-tests
          command: go mod download
      - run:
          name: Lint/Vet/Build op-acceptance-tests/cmd
          working_directory: op-acceptance-tests
          command: |
            just cmd-check
      # Prepare the test environment
      - run:
          name: Prepare test environment (compile tests and cache build results)
          working_directory: op-acceptance-tests
          command: go test -v -c -o /dev/null $(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./tests/...)
      # Run the acceptance tests (if the devnet is running)
      - run:
          name: Run acceptance tests (gate=<<parameters.gate>>)
          working_directory: op-acceptance-tests
          no_output_timeout: 1h
          command: |
            if [[ "<<parameters.gate>>" == "" ]]; then
              echo "Running in gateless mode - auto-discovering all tests in ./op-acceptance-tests/..."
            else
              echo "Running in gate mode (gate=<<parameters.gate>>)"
            fi
            LOG_LEVEL=info just acceptance-test "" "<<parameters.gate>>"
      - run:
          name: Print results (summary)
          working_directory: op-acceptance-tests
          command: |
            LOG_DIR=$(ls -td -- logs/* | head -1)
            cat "$LOG_DIR/summary.log" || true
      - run:
          name: Print results (failures)
          working_directory: op-acceptance-tests
          command: |
            LOG_DIR=$(ls -td -- logs/* | head -1)
            cat "$LOG_DIR/failed/*.log" || true
          when: on_fail
      - run:
          name: Print results (all)
          working_directory: op-acceptance-tests
          command: |
            LOG_DIR=$(ls -td -- logs/* | head -1)
            cat "$LOG_DIR/all.log" || true
      - run:
          name: Generate JUnit XML test report for CircleCI
          working_directory: op-acceptance-tests
          when: always
          command: |
            LOG_DIR=$(ls -td -- logs/* | head -1)
            gotestsum --junitfile results/results.xml --raw-command cat $LOG_DIR/raw_go_events.log || true
      # Save the module cache for future runs
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
      # Store test results and artifacts
      - when:
          condition: always
          steps:
            - store_test_results:
                path: ./op-acceptance-tests/results
      - when:
          condition: always
          steps:
            - store_artifacts:
                path: ./op-acceptance-tests/logs
      - when:
          condition: on_fail
          steps:
            - notify-failures-on-develop:
                mentions: "@protocol-devx-pod @changwan"

workflows:
  memory-all:
    when:
      or:
        - equal: ["webhook", << pipeline.trigger_source >>]
        - and:
            - equal: [true, <<pipeline.parameters.acceptance_tests_dispatch>>]
            - equal: ["api", << pipeline.trigger_source >>]
    jobs:
      - contracts-bedrock-build:
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-prestate-quick:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-kona-prestate:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-build-binary:
          name: cannon-kona-host
          directory: kona
          profile: "release"
          binary: "kona-host"
          save_cache: true
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-build-binary:
          name: kona-build-release
          directory: kona
          profile: "release"
          features: "default"
          save_cache: true
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-build-submodule:
          name: rust-build-op-rbuilder
          directory: op-rbuilder
          binaries: "op-rbuilder"
          build_command: cargo build --release -p op-rbuilder --bin op-rbuilder
          needs_clang: true
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-build-submodule:
          name: rust-build-rollup-boost
          directory: rollup-boost
          binaries: "rollup-boost"
          build_command: cargo build --release -p rollup-boost --bin rollup-boost
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binaries-for-sysgo:
          requires:
            - kona-build-release
            - rust-build-op-rbuilder
            - rust-build-rollup-boost
      - op-acceptance-tests:
          name: memory-all
          gate: ""
          no_output_timeout: 120m
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
            - discord
          requires:
            - contracts-bedrock-build
            - cannon-prestate-quick
            - cannon-kona-prestate
            - cannon-kona-host
            - rust-binaries-for-sysgo
